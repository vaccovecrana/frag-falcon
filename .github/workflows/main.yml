name: Native Build
on:
  release:
    types: [ created ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Display release tag
        run: echo ${{ github.event.release.tag_name }}
      - name: Pull Docker Image
        run: docker pull gradle:jdk25-graal
      - name: Gradle Build
        run: |
          docker run --rm \
            -e GITHUB_REF=${{ github.ref }} \
            -e GITHUB_SHA=${{ github.sha }} \
            -e PLUGIN_ORGCONFIG=https://raw.githubusercontent.com/vaccovecrana/org-config/refs/heads/main/vacco-oss-java-25.json \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            gradle:jdk25-graal \
            gradle clean distNativeTar
      - name: Stage stable-named artifact
        run: cp ff-app/build/distributions/frag-falcon-*.tar.gz /tmp/frag-falcon.tar.gz
      - name: Upload stable-named asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref }}
          file: /tmp/frag-falcon.tar.gz
          asset_name: frag-falcon.tar.gz
          overwrite: true
